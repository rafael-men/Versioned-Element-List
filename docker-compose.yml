services:
  mysql:
    image: mysql:8.4
    container_name: lista-versionada-db
    restart: unless-stopped

    env_file:
      - ./server/.env

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: lista-versionada-api
    restart: unless-stopped

    env_file:
      - ./server/.env

    ports:
      - "4000:4000"

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: